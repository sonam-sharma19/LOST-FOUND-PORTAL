<!DOCTYPE html>
<html lang="en">

<head>
    <title>Report Item</title>
</head>

<body>
    <section class="hero">
        <h1>Report Lost / Found Item</h1>

        <form>
            <input type="text" placeholder="Item Name"><br><br>
            <input type="text" placeholder="Location"><br><br>

            <select>
            <option value="lost">Lost</option>
            <option value="found">Found</option>
            </select><br><br>

            <textarea placeholder="Description"></textarea><br><br>
            <button>Submit</button>
        </form>

    </section>
</body>
</html>
